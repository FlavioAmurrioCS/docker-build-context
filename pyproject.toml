#:schema https://www.schemastore.org/pyproject.json
[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "docker-build-context"
dynamic = ["version"]
description = "List the files Docker sends to the daemon as a build context."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = [
  "docker",
  "dockerignore",
  "build-context",
  "buildkit",
  "pre-commit",
]
authors = [
  { name = "Flavio Amurrio", email = "25621374+FlavioAmurrioCS@users.noreply.github.com" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Go",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
  "Topic :: Software Development :: Build Tools",
  "Topic :: Utilities",
]
dependencies = [
]

[project.urls]
Documentation = "https://github.com/FlavioAmurrioCS/docker-build-context#readme"
Issues = "https://github.com/FlavioAmurrioCS/docker-build-context/issues"
Source = "https://github.com/FlavioAmurrioCS/docker-build-context"

# No [project.scripts]: the Go binary ships in the wheel's .data/scripts
# directory, so it installs onto PATH directly. A console_scripts shim would
# add ~30-50ms of interpreter startup to every invocation, which matters for a
# pre-commit hook.

[dependency-groups]
dev = [
  { include-group = "test" },
  { include-group = "types" },
]
test = [
  "pytest",
  "pytest-cov",
]
types = [
  { include-group = "test" },
  # hatch_build.py imports hatchling, so the checkers need it to resolve.
  "hatchling",
  "mypy",
  "typing-extensions",
]
type-checkers = [
  { include-group = "types" },
  "basedpyright",
  "pyrefly",
  "pyright[nodejs]",
  "ty",
  "zuban",
]

###############################################################################
# region: hatch
###############################################################################
[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/docker_build_context/_version.py"

[tool.hatch.build.targets.wheel]
packages = [
  "src/docker_build_context",
]

# Compiles ./cmd/docker-build-context and places it in .data/scripts. Scoped to
# the wheel target so building an sdist does not need a Go toolchain.
[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

# The sdist has to carry the Go sources, because building a wheel from it
# recompiles the binary.
[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/cmd",
  "/internal",
  "/testdata",
  "/tests",
  "/scripts",
  "/go.mod",
  "/go.sum",
  "/hatch_build.py",
  "/README.md",
  "/LICENSE",
]
###############################################################################
# endregion: hatch
###############################################################################

###############################################################################
# region: coverage
###############################################################################
[tool.coverage.run]
source_pkgs = ["docker_build_context", "tests"]
branch = true
parallel = true
omit = [
  "**/_version.py",
  "**/__main__.py",
]

[tool.coverage.paths]
docker_build_context = ["src/docker_build_context"]
tests = ["tests"]

[tool.coverage.report]
exclude_lines = [
  "no cov",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]
###############################################################################
# endregion: coverage
###############################################################################

###############################################################################
# region: ruff
###############################################################################
[tool.ruff]
line-length = 100
# The fixture contexts hold deliberately meaningless files; they exist to be
# walked by the Go tests, not to be valid Python.
extend-exclude = [
  "testdata",
]

[tool.ruff.lint]
select = [
  "ALL",
]
ignore = [
  "COM812",  # missing-trailing-comma
  "D",       # pydocstyle
  "ERA001",  # commented-out-code
  "EXE003",  # shebang-missing-python
  "ISC001",  # single-line-implicit-string-concatenation
  "PTH",     # flake8-use-pathlib
  "T20",     # flake8-print
  "PLC0415", # import-outside-top-level
]

[tool.ruff.lint.isort]
force-single-line = true

[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = 100

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
  "S101",    # assert is how pytest works
  "PLR2004", # comparing against literal line numbers and exit codes is the point
]
###############################################################################
# endregion: ruff
###############################################################################

###############################################################################
# region: rumdl
###############################################################################
[tool.rumdl]
exclude = [
  # Fixture contexts hold deliberately meaningless markdown; they exist to be
  # walked, not to be well-formed documents.
  "testdata",
]
disable = [
  # MD014 wants the "$" prompt dropped from commands that show no output. The
  # README uses console fences with prompts on purpose, and neighbouring blocks
  # do show output, so the prompt marks which lines are commands.
  "MD014",
]
###############################################################################
# endregion: rumdl
###############################################################################

###############################################################################
# region: type-checkers
###############################################################################
[tool.mypy]
# https://mypy.readthedocs.io/en/stable/config_file.html
strict = true
files = ["src", "tests", "hatch_build.py"]
exclude = ["^testdata/"]

[tool.zuban]
# https://docs.zubanls.com/en/latest/usage.html#configuration
mode = "default"
strict = true
exclude = ["^testdata/"]

[tool.pyright]
# https://github.com/microsoft/pyright/blob/main/docs/configuration.md
typeCheckingMode = "strict"
reportUnusedImport = false
include = ["src", "tests", "hatch_build.py"]
exclude = ["testdata", "**/node_modules", "**/__pycache__"]

[tool.pyrefly]
# https://pyrefly.org/en/docs/configuration/
preset = "strict"
project-includes = ["src", "tests", "hatch_build.py"]
project-excludes = ["testdata/**"]

[tool.ty.src]
exclude = ["testdata"]

[tool.ty.rules]
# https://docs.astral.sh/ty/reference/configuration/
all = "error"
###############################################################################
# endregion: type-checkers
###############################################################################
